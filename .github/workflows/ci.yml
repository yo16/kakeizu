name: CI

on:
  push:
    branches-ignore:
      # 保護ブランチは PR トリガーでカバーするため push 時の二重実行を避ける
      - release
      - preview
  pull_request:

jobs:
  ci:
    name: Lint / TypeCheck / Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit test
        run: npm test -- --ci
